{% extends "examples/base.html" %}

{% block example_description %}
{% load example_helpers %}
{% filter markdown %}
# Froms
More complex example demonstrating forms
{% endfilter %}
{% endblock %}

{% block example %}
<form class="flex flex-col gap-7 max-w-xl @container"
  action="{% url 'examples:addresses:update' pk=object.pk %}" method="POST" novalidate>
  {% include 'examples/address_form.html' %}
  {% csrf_token %}
  <div class="flex flex-col gap-5 @sm:flex-row @sm:gap-4">
    <a class="flex flex-col justify-center items-center h-10 px-4 border-2 border-ui-primary rounded-ui-md bg-ui-bg w-full" href="{% url 'examples:addresses:Addresses' %}">Cancel</a>
    <button class="flex flex-col justify-center items-center h-10 px-4 border-2 border-ui-primary rounded-ui-md bg-ui-bg w-full"
      type="submit">Save</button>
  </div>
</form>
{% endblock %}
