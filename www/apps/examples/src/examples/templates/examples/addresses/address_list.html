<div id="address-view" data-ajt-mode="update" data-ajt-view-transition-types="update-list modal">
  {% if object_list %}
  <ul id="address-list" class="grid sm:grid-cols-[repeat(auto-fill,_minmax(var(--container-xs),_1fr))] auto-rows-fr gap-4">
    {% for object in object_list %}
    {% include 'examples/addresses/list_item.html' %}
    {% endfor %}
  </ul>
  {% else %}
  <div>No addresses stored</div>
  {% endif %}
</div>
