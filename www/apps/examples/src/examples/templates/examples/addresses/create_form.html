<form class="flex flex-col gap-7 max-w-xl @container"
  action="{% url 'examples:addresses:create-new' %}" method="POST" novalidate>
  <h2>Create new address</h2>
  {% include 'examples/address_form.html' %}
  {% csrf_token %}
  <div class="flex flex-col gap-5 @sm:flex-row @sm:gap-4">
    <button class="flex flex-col justify-center items-center h-10 px-4 border-2 border-ui-primary rounded-ui-md bg-ui-bg w-full cursor-pointer"
      formaction="{% url 'examples:addresses:Addresses' %}"
      formmethod="GET"
      data-role="close-dialog-btn"
      autofocus
    >Cancel</button>
    <button class="flex flex-col justify-center items-center h-10 px-4 border-2 border-ui-primary rounded-ui-md bg-ui-bg w-full cursor-pointer"
      type="submit">Create</button>
  </div>
</form>
