<form id="new-address-form"
  class="flex flex-col gap-7 max-w-xl @container"
  action="{% url 'examples:addresses:delete' pk=object.pk %}"
  method="POST"
  {% if is_ajax %}
  data-ajt-mode="update"
  data-ajt-trigger="submit"
  {% endif %}
  novalidate>
  <h2>Delete address</h2>
  <div class="flex flex-col gap-4">
    <div>Are you sure you want to delete address:</div>
    <div class="flex flex-col">
      <span>{{ address.address }}</span>
      <span>{{ address.city }}</span>
      <span>{{ address.state }}</span>
      <span>{{ address.postal_code }}</span>
      <span>{{ address.country_code }}</span>
    </div>
  </div>
  {% csrf_token %}
  <div class="flex flex-col gap-5 @sm:flex-row @sm:gap-4">
    <a class="flex flex-col justify-center items-center h-10 px-4 border-2 border-ui-primary rounded-ui-md bg-ui-bg w-full cursor-pointer"
      href="{% url 'examples:addresses:Addresses' %}"
      data-role="close-dialog-btn">Cancel</a>
    <button class="flex flex-col justify-center items-center h-10 px-4 border-2 border-ui-primary rounded-ui-md bg-ui-bg w-full cursor-pointer"
      type="submit">Delete</button>
  </div>
</form>
